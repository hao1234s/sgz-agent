[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sgz-dsh-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["mss>=10,<11", "Pillow>=11,<13", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]

[project.scripts]
sgz-agent = "sgz_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

