[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sgz-dsh-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["mss==10.2.0", "Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
knowledge = ["qdrant-client>=1.15,<2", "fastembed>=0.7,<1"]

[project.scripts]
sgz-agent = "sgz_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

